# Spring Application Name
spring.application.name=SheReDefine

# Server Port
server.port=8080

# ----------------------------------------
# H2 Database Config (Default for Prototyping)
# ----------------------------------------
spring.datasource.url=jdbc:h2:mem:sheredefinedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console under /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ----------------------------------------
# MySQL Database Config (Production/Deployment alternative)
# Uncomment to use MySQL:
# ----------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/sheredefine_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ----------------------------------------
# JPA / Hibernate Configurations
# ----------------------------------------
# Auto-create/update tables based on entity definitions
spring.jpa.hibernate.ddl-auto=update
# Display SQL statements in logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
